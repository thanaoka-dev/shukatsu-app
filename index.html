<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>就活マネジメント・ダッシュボード | 選考ファネル＆ES締切管理</title>
  <style>
    :root {
      --navy: #0f2540;
      --navy-light: #1d3b63;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --success: #059669;
      --success-bg: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title-area h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    .title-area p {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: #cbd5e1;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      color: #e2e8f0;
    }
    .status-pill.connected {
      background: #065f46;
      color: #a7f3d0;
    }
    .status-pill.demo {
      background: #92400e;
      color: #fde68a;
    }
    .container {
      max-width: 1120px;
      margin: 18px auto 48px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(15, 37, 64, 0.04);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    /* GAS Bar */
    .gas-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .gas-bar input {
      flex: 1;
      min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.05s;
    }
    button:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-outline { background: #fff; color: var(--navy); border: 1px solid var(--border); }
    .btn-demo { background: #f59e0b; color: #1e293b; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; padding: 5px 10px; font-size: 0.78rem; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

    /* KPI & Funnel */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 16px;
    }
    @media (max-width: 820px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .kpi-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .kpi-label { font-size: 0.76rem; color: var(--muted); }
    .kpi-val { font-size: 1.45rem; font-weight: 800; color: var(--navy); margin-top: 2px; }
    .kpi-val.danger { color: var(--danger); }
    .kpi-val.success { color: var(--success); }

    .funnel-row {
      margin-bottom: 10px;
    }
    .funnel-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .funnel-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .funnel-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--navy), var(--accent));
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .bottleneck-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      font-size: 0.82rem;
      color: var(--navy);
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 820px) {
      .form-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.span-2 { grid-column: span 2; }
    @media (max-width: 480px) { .field.span-2 { grid-column: span 1; } }
    .field label { font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .field input, .field select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.86rem;
      background: #fff;
    }

    /* Filter */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .filter-bar input, .filter-bar select {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.83rem;
    }

    /* Company Cards */
    .company-list { display: flex; flex-direction: column; gap: 10px; }
    .company-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .company-item.urgent { border-left: 5px solid var(--danger); background: #fffafa; }
    .company-item.soon { border-left: 5px solid var(--warn); }
    .company-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .company-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .company-name { font-size: 1rem; font-weight: 700; color: var(--navy); }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-s { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge-a { background: #e0f2fe; color: #075985; }
    .badge-b { background: #f1f5f9; color: #475569; }
    .badge-fire { background: var(--danger); color: #fff; }
    .badge-phase { background: var(--navy); color: #fff; }
    .badge-rejected { background: #e2e8f0; color: #64748b; }
    .badge-offer { background: var(--success); color: #fff; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text);
    }
    .flow-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #334155;
    }
    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--navy);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.84rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="title-area">
      <h1>就活マネジメント・ダッシュボード</h1>
      <p>選考フロー統合・ファネル通過率分析・優先度自動判定</p>
    </div>
    <div class="header-actions">
      <span id="connStatus" class="status-pill">ローカル保存モード</span>
      <button class="btn-demo btn-sm" onclick="toggleDemoMode()" id="demoBtn">デモデータ読込</button>
    </div>
  </div>
</header>

<div class="container">

  <!-- GAS Connection -->
  <div class="card">
    <div class="gas-bar">
      <input type="text" id="gasUrlInput" placeholder="GAS ウェブアプリURL (https://script.google.com/macros/s/.../exec)" />
      <button class="btn-navy" onclick="saveGasUrl()">URLを保存して同期</button>
      <button class="btn-outline" onclick="syncFromSheet()">再読込</button>
    </div>
  </div>

  <!-- Dashboard: KPI + Funnel -->
  <div class="grid-2">
    <div class="card">
      <div class="card-title"><span>進捗サマリー（アクション指標）</span></div>
      <div class="kpi-grid">
        <div class="kpi-box">
          <div class="kpi-label">エントリー総数</div>
          <div class="kpi-val" id="kpiTotal">0社</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">最優先タスク（S志望×7日以内）</div>
          <div class="kpi-val danger" id="kpiPriority">0件</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">未提出ES・直近予定</div>
          <div class="kpi-val" id="kpiPending">0件</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-label">選考中 / 内定</div>
          <div class="kpi-val success" id="kpiActive">0社</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>選考ファネル分析（通過率ボトルネック診断）</span></div>
      <div id="funnelContainer"></div>
      <div class="bottleneck-box" id="bottleneckAdvice">データを登録すると選考段階ごとの通過率と改善ポイントを自動診断します。</div>
    </div>
  </div>

  <!-- Add / Edit Form -->
  <div class="card">
    <div class="card-title">
      <span id="formHeaderTitle">新規企業の登録</span>
      <button class="btn-outline btn-sm" id="cancelEditBtn" style="display:none;" onclick="resetForm()">編集をキャンセル</button>
    </div>
    <input type="hidden" id="editId" />
    <div class="form-grid">
      <div class="field">
        <label>企業名 *</label>
        <input type="text" id="fCompany" placeholder="例：株式会社〇〇" />
      </div>
      <div class="field">
        <label>志望度</label>
        <select id="fPriority">
          <option value="S">S（第一志望群）</option>
          <option value="A" selected>A（本命・有力）</option>
          <option value="B">B（併願・検討）</option>
        </select>
      </div>
      <div class="field">
        <label>現在の選考フェーズ</label>
        <select id="fPhase">
          <option value="ES準備">ES準備</option>
          <option value="ES提出済">ES提出済</option>
          <option value="Webテスト">Webテスト</option>
          <option value="一次面接">一次面接</option>
          <option value="二次面接">二次面接</option>
          <option value="最終面接">最終面接</option>
          <option value="内定">内定</option>
          <option value="お見送り">お見送り</option>
        </select>
      </div>
      <div class="field">
        <label>ES締切日</label>
        <input type="date" id="fDeadline" />
      </div>
      <div class="field">
        <label>次回面接・試験日</label>
        <input type="date" id="fNextDate" />
      </div>
      <div class="field">
        <label>ES提出状況</label>
        <select id="fStatus">
          <option value="未提出">未提出</option>
          <option value="提出済">提出済</option>
        </select>
      </div>
      <div class="field">
        <label>マイページURL</label>
        <input type="url" id="fUrl" placeholder="https://..." />
      </div>
      <div class="field">
        <label>ログインID</label>
        <input type="text" id="fLoginId" placeholder="IDやメアド" />
      </div>
      <div class="field span-2">
        <label>選考フロー（全体像）</label>
        <input type="text" id="fFlow" placeholder="例：ES → SPI → 一次(個人) → 二次(GD) → 最終" />
      </div>
      <div class="field span-2">
        <label>対策メモ・設問テーマ</label>
        <input type="text" id="fMemo" placeholder="例：ガクチカ400字、志望動機300字 / 逆質問準備" />
      </div>
    </div>
    <div style="margin-top: 12px; text-align: right;">
      <button class="btn-primary" onclick="handleSaveItem()" id="submitBtn">企業を追加する</button>
    </div>
  </div>

  <!-- Filter & List -->
  <div class="card">
    <div class="card-title"><span>登録企業一覧（優先度・期限順）</span></div>
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="企業名・フロー・メモ検索..." oninput="render()" />
      <select id="filterPriority" onchange="render()">
        <option value="ALL">志望度：すべて</option>
        <option value="S">志望度 S のみ</option>
        <option value="A">志望度 A のみ</option>
        <option value="B">志望度 B のみ</option>
      </select>
      <select id="filterPhase" onchange="render()">
        <option value="ACTIVE">選考中のみ（お見送り除外）</option>
        <option value="ALL">すべてのフェーズ</option>
        <option value="ES準備">ES準備</option>
        <option value="Webテスト">Webテスト</option>
        <option value="面接">面接段階（一次〜最終）</option>
        <option value="内定">内定</option>
        <option value="お見送り">お見送り</option>
      </select>
    </div>
    <div class="company-list" id="companyList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'shukatsu_v2_items';
  const GAS_KEY = 'shukatsu_gas_url';
  let items = [];
  let isDemo = false;

  const DEMO_ITEMS = [
    { id: 'd1', company: '第一志望テック株式会社', priority: 'S', phase: '二次面接', deadline: offsetDate(-10), nextDate: offsetDate(2), status: '提出済', url: 'https://example.com', loginId: 'taro_2027', flow: 'ES → 玉手箱 → 一次(現場) → 二次(部長) → 最終(役員)', memo: '一次では開発アプリの課題設計を深掘りされた。二次は事業貢献を語る。' },
    { id: 'd2', company: 'グローバル総合商社A', priority: 'S', phase: 'ES準備', deadline: offsetDate(3), nextDate: '', status: '未提出', url: 'https://example.com', loginId: 'yamada01', flow: 'ES → Webテスト → GD → 一次 → 二次 → 最終', memo: '設問：困難を乗り越えた経験(400字)。数値を入れて推敲中。' },
    { id: 'd3', company: 'フロンティアITソリューションズ', priority: 'A', phase: 'Webテスト', deadline: offsetDate(-3), nextDate: offsetDate(4), status: '提出済', url: 'https://example.com', loginId: 't_yamada', flow: 'ES → SPI(テストセンター) → 一次 → 最終', memo: 'SPI言語・非言語の対策完了。期限までに受検予約確定。' },
    { id: 'd4', company: 'ネクストクラウド株式会社', priority: 'A', phase: '一次面接', deadline: offsetDate(-12), nextDate: offsetDate(6), status: '提出済', url: 'https://example.com', loginId: 'yamada_nc', flow: 'ES → 一次(オンライン) → 最終(対面)', memo: 'GitHub Pagesのデモ画面を共有できるよう準備済み。' },
    { id: 'd5', company: 'イノベーション金融グループ', priority: 'B', phase: '内定', deadline: offsetDate(-25), nextDate: '', status: '提出済', url: 'https://example.com', loginId: 'fin_2027', flow: 'ES → テスト → 一次 → 二次 → 最終', memo: 'DX推進部門で内々定獲得。' },
    { id: 'd6', company: 'スタンダード製造株式会社', priority: 'B', phase: 'お見送り', deadline: offsetDate(-20), nextDate: '', status: '提出済', url: 'https://example.com', loginId: 'mfg_88', flow: 'ES → SPI → 一次面接', memo: '一次面接で企業研究の深さが不足していたため改善。' },
    { id: 'd7', company: 'デジタルコンサルティングB', priority: 'S', phase: 'ES準備', deadline: offsetDate(6), nextDate: '', status: '未提出', url: 'https://example.com', loginId: 'dc_taro', flow: 'ES → ケース面接 → 一次 → 最終', memo: 'フェルミ推定とケース対策を並行して進める。' },
    { id: 'd8', company: 'エンタープライズシステムズ', priority: 'A', phase: 'ES提出済', deadline: offsetDate(-2), nextDate: '', status: '提出済', url: 'https://example.com', loginId: 'ent_09', flow: 'ES → Webテスト → 一次 → 最終', memo: '結果待ち（来週金曜までに連絡予定）。' }
  ];

  function offsetDate(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  window.onload = async () => {
    const savedUrl = localStorage.getItem(GAS_KEY) || '';
    document.getElementById('gasUrlInput').value = savedUrl;
    if (savedUrl) {
      await syncFromSheet();
    } else {
      items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      render();
    }
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function saveGasUrl() {
    const url = document.getElementById('gasUrlInput').value.trim();
    if (!url) {
      localStorage.removeItem(GAS_KEY);
      updateConnPill(false);
      showToast('GAS URLを解除しました');
      return;
    }
    localStorage.setItem(GAS_KEY, url);
    isDemo = false;
    document.getElementById('demoBtn').textContent = 'デモデータ読込';
    syncFromSheet();
  }

  function updateConnPill(connected) {
    const pill = document.getElementById('connStatus');
    if (isDemo) {
      pill.textContent = 'デモモード表示中（本番データ非表示）';
      pill.className = 'status-pill demo';
    } else if (connected) {
      pill.textContent = 'スプレッドシート連携中';
      pill.className = 'status-pill connected';
    } else {
      pill.textContent = 'ローカル保存モード';
      pill.className = 'status-pill';
    }
  }

  async function syncFromSheet() {
    const url = localStorage.getItem(GAS_KEY);
    if (!url) {
      showToast('GAS URLが設定されていません');
      return;
    }
    try {
      showToast('同期中...');
      const res = await fetch(url);
      const json = await res.json();
      if (json.status === 'ok') {
        items = json.data || [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        isDemo = false;
        document.getElementById('demoBtn').textContent = 'デモデータ読込';
        updateConnPill(true);
        render();
        showToast('スプレッドシートと同期しました');
      }
    } catch (e) {
      updateConnPill(false);
      showToast('同期に失敗しました。URLとGASデプロイを確認してください');
    }
  }

  function toggleDemoMode() {
    isDemo = !isDemo;
    const btn = document.getElementById('demoBtn');
    if (isDemo) {
      btn.textContent = '本番データに戻る';
      showToast('デモデータを読み込みました');
    } else {
      btn.textContent = 'デモデータ読込';
      showToast('本番データに戻りました');
    }
    updateConnPill(!!localStorage.getItem(GAS_KEY));
    render();
  }

  function getActiveList() {
    return isDemo ? DEMO_ITEMS : items;
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / (1000 * 60 * 60 * 24));
  }

  function getRelevantDate(item) {
    if (item.phase === 'ES準備' && item.deadline) return { label: 'ES締切', date: item.deadline };
    if (item.nextDate) return { label: '次回予定', date: item.nextDate };
    if (item.deadline) return { label: 'ES締切', date: item.deadline };
    return null;
  }

  function isHighPriorityTask(item) {
    if (item.phase === 'お見送り' || item.phase === '内定') return false;
    const rel = getRelevantDate(item);
    if (!rel) return false;
    const diff = daysUntil(rel.date);
    return item.priority === 'S' && diff !== null && diff <= 7;
  }

  async function handleSaveItem() {
    if (isDemo) {
      showToast('デモモード中は保存できません');
      return;
    }
    const company = document.getElementById('fCompany').value.trim();
    if (!company) {
      showToast('企業名を入力してください');
      return;
    }
    const editId = document.getElementById('editId').value;
    const item = {
      id: editId || ('id_' + Date.now()),
      company,
      priority: document.getElementById('fPriority').value,
      phase: document.getElementById('fPhase').value,
      deadline: document.getElementById('fDeadline').value,
      nextDate: document.getElementById('fNextDate').value,
      status: document.getElementById('fStatus').value,
      url: document.getElementById('fUrl').value.trim(),
      loginId: document.getElementById('fLoginId').value.trim(),
      flow: document.getElementById('fFlow').value.trim(),
      memo: document.getElementById('fMemo').value.trim()
    };

    if (editId) {
      items = items.map(x => x.id === editId ? item : x);
    } else {
      items.push(item);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    render();
    resetForm();

    const gasUrl = localStorage.getItem(GAS_KEY);
    if (gasUrl) {
      try {
        await fetch(gasUrl, {
          method: 'POST',
          body: JSON.stringify({ action: editId ? 'update' : 'add', item })
        });
        showToast('スプレッドシートに保存しました');
      } catch (e) {
        showToast('ローカル保存完了（シート同期は再読込で確認してください）');
      }
    } else {
      showToast('保存しました');
    }
  }

  function startEdit(id) {
    const target = getActiveList().find(x => x.id === id);
    if (!target) return;
    document.getElementById('editId').value = target.id;
    document.getElementById('fCompany').value = target.company;
    document.getElementById('fPriority').value = target.priority || 'A';
    document.getElementById('fPhase').value = target.phase || 'ES準備';
    document.getElementById('fDeadline').value = target.deadline || '';
    document.getElementById('fNextDate').value = target.nextDate || '';
    document.getElementById('fStatus').value = target.status || '未提出';
    document.getElementById('fUrl').value = target.url || '';
    document.getElementById('fLoginId').value = target.loginId || '';
    document.getElementById('fFlow').value = target.flow || '';
    document.getElementById('fMemo').value = target.memo || '';

    document.getElementById('formHeaderTitle').textContent = '企業情報の編集：' + target.company;
    document.getElementById('submitBtn').textContent = '変更を保存する';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('fCompany').value = '';
    document.getElementById('fPriority').value = 'A';
    document.getElementById('fPhase').value = 'ES準備';
    document.getElementById('fDeadline').value = '';
    document.getElementById('fNextDate').value = '';
    document.getElementById('fStatus').value = '未提出';
    document.getElementById('fUrl').value = '';
    document.getElementById('fLoginId').value = '';
    document.getElementById('fFlow').value = '';
    document.getElementById('fMemo').value = '';
    document.getElementById('formHeaderTitle').textContent = '新規企業の登録';
    document.getElementById('submitBtn').textContent = '企業を追加する';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  async function deleteItem(id) {
    if (isDemo) {
      showToast('デモモード中は削除できません');
      return;
    }
    if (!confirm('この企業データを削除しますか？')) return;
    items = items.filter(x => x.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    render();

    const gasUrl = localStorage.getItem(GAS_KEY);
    if (gasUrl) {
      await fetch(gasUrl, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id })
      });
    }
    showToast('削除しました');
  }

  function copyText(txt) {
    if (!txt) return;
    navigator.clipboard.writeText(txt);
    showToast('IDをコピーしました：' + txt);
  }

  function renderFunnel(list) {
    const total = list.length;
    const submitted = list.filter(x => x.phase !== 'ES準備' || x.status === '提出済').length;
    const passedDoc = list.filter(x => ['一次面接','二次面接','最終面接','内定'].includes(x.phase)).length;
    const passedFirst = list.filter(x => ['二次面接','最終面接','内定'].includes(x.phase)).length;
    const offer = list.filter(x => x.phase === '内定').length;

    const stages = [
      { label: '① ES提出済（応募母数）', count: submitted, base: total },
      { label: '② 書類・Webテスト通過（面接到達）', count: passedDoc, base: submitted },
      { label: '③ 一次面接通過（二次・最終到達）', count: passedFirst, base: passedDoc },
      { label: '④ 内定獲得', count: offer, base: total }
    ];

    const container = document.getElementById('funnelContainer');
    container.innerHTML = stages.map(s => {
      const rate = s.base > 0 ? Math.round((s.count / s.base) * 100) : 0;
      return `
        <div class="funnel-row">
          <div class="funnel-header">
            <span>${s.label}</span>
            <span>${s.count}社（${rate}%）</span>
          </div>
          <div class="funnel-track">
            <div class="funnel-fill" style="width:${rate}%"></div>
          </div>
        </div>
      `;
    }).join('');

    const adviceEl = document.getElementById('bottleneckAdvice');
    if (submitted === 0) {
      adviceEl.textContent = 'ES提出済みの企業が増えると、書類通過率・面接通過率のボトルネックを自動診断します。';
      return;
    }
    const docRate = Math.round((passedDoc / submitted) * 100);
    const firstRate = passedDoc > 0 ? Math.round((passedFirst / passedDoc) * 100) : null;

    if (docRate < 50) {
      adviceEl.innerHTML = `<strong>診断結果：</strong>現在のボトルネックは<strong>「書類・Webテスト段階（通過率 ${docRate}%）」</strong>です。ESの設問適合度とWebテスト対策を優先強化しましょう。`;
    } else if (firstRate !== null && firstRate < 50) {
      adviceEl.innerHTML = `<strong>診断結果：</strong>書類通過率は <strong>${docRate}%</strong> と良好ですが、<strong>「一次面接（通過率 ${firstRate}%）」</strong>がボトルネックです。ガクチカの深掘り対策を重点化しましょう。`;
    } else {
      adviceEl.innerHTML = `<strong>診断結果：</strong>書類通過率 <strong>${docRate}%</strong> で順調に推移しています。志望度Sの直近タスクに集中しましょう。`;
    }
  }

  function render() {
    const list = getActiveList();

    // KPI
    document.getElementById('kpiTotal').textContent = list.length + '社';
    document.getElementById('kpiPriority').textContent = list.filter(isHighPriorityTask).length + '件';
    document.getElementById('kpiPending').textContent = list.filter(x => x.phase !== 'お見送り' && x.phase !== '内定' && (x.status === '未提出' || x.nextDate)).length + '件';
    document.getElementById('kpiActive').textContent = list.filter(x => x.phase !== 'お見送り').length + '社';

    renderFunnel(list);

    // Filter
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const fPrio = document.getElementById('filterPriority').value;
    const fPhase = document.getElementById('filterPhase').value;

    let filtered = list.filter(item => {
      if (fPrio !== 'ALL' && (item.priority || 'A') !== fPrio) return false;
      if (fPhase === 'ACTIVE' && item.phase === 'お見送り') return false;
      if (fPhase === '面接' && !['一次面接','二次面接','最終面接'].includes(item.phase)) return false;
      if (!['ALL','ACTIVE','面接'].includes(fPhase) && item.phase !== fPhase) return false;
      if (q) {
        const hay = `${item.company} ${item.flow || ''} ${item.memo || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    // Sort: High Priority -> Active Date Soon -> Priority S/A/B -> Rejected last
    filtered.sort((a, b) => {
      const aDone = (a.phase === 'お見送り' || a.phase === '内定') ? 1 : 0;
      const bDone = (b.phase === 'お見送り' || b.phase === '内定') ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;

      const aFire = isHighPriorityTask(a) ? 0 : 1;
      const bFire = isHighPriorityTask(b) ? 0 : 1;
      if (aFire !== bFire) return aFire - bFire;

      const aRel = getRelevantDate(a);
      const bRel = getRelevantDate(b);
      if (aRel && bRel) return aRel.date.localeCompare(bRel.date);
      if (aRel) return -1;
      if (bRel) return 1;
      return 0;
    });

    const container = document.getElementById('companyList');
    if (filtered.length === 0) {
      container.innerHTML = '<p style="color:#64748b;font-size:0.86rem;">該当する企業がありません。</p>';
      return;
    }

    container.innerHTML = filtered.map(item => {
      const prio = item.priority || 'A';
      const prioClass = prio === 'S' ? 'badge-s' : (prio === 'A' ? 'badge-a' : 'badge-b');
      const fire = isHighPriorityTask(item);
      const rel = getRelevantDate(item);
      const diff = rel ? daysUntil(rel.date) : null;

      let itemClass = 'company-item';
      let dateText = '日程未設定';
      if (rel && item.phase !== 'お見送り' && item.phase !== '内定') {
        if (diff < 0) {
          dateText = `${rel.label}：${rel.date}（期限超過）`;
          itemClass += ' urgent';
        } else if (diff <= 3) {
          dateText = `${rel.label}：${rel.date}（あと${diff}日）`;
          itemClass += ' urgent';
        } else if (diff <= 7) {
          dateText = `${rel.label}：${rel.date}（あと${diff}日）`;
          itemClass += ' soon';
        } else {
          dateText = `${rel.label}：${rel.date}（あと${diff}日）`;
        }
      } else if (rel) {
        dateText = `${rel.label}：${rel.date}`;
      }

      const phaseBadgeClass = item.phase === 'お見送り' ? 'badge-rejected' : (item.phase === '内定' ? 'badge-offer' : 'badge-phase');

      return `
        <div class="${itemClass}">
          <div class="company-top">
            <div class="company-name-wrap">
              <span class="badge ${prioClass}">志望度 ${prio}</span>
              <span class="badge ${phaseBadgeClass}">${item.phase || 'ES準備'}</span>
              ${fire ? '<span class="badge badge-fire">🔥 最優先</span>' : ''}
              <span class="company-name">${escapeHtml(item.company)}</span>
            </div>
            <div style="font-size:0.82rem; font-weight:700; color:${diff !== null && diff <= 3 && item.phase !== 'お見送り' && item.phase !== '内定' ? '#dc2626' : '#334155'};">
              ${dateText}
            </div>
          </div>
          ${item.flow ? `<div class="flow-box"><strong>選考フロー：</strong>${escapeHtml(item.flow)}</div>` : ''}
          <div class="meta-row">
            <span>ES状況：<strong>${item.status || '未提出'}</strong></span>
            ${item.loginId ? `<span>ID：<code>${escapeHtml(item.loginId)}</code> <button class="btn-outline btn-sm" onclick="copyText('${escapeHtml(item.loginId)}')">コピー</button></span>` : ''}
            ${item.memo ? `<span>メモ：${escapeHtml(item.memo)}</span>` : ''}
          </div>
          <div class="item-actions">
            ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener"><button class="btn-outline btn-sm">マイページを開く ↗</button></a>` : ''}
            <button class="btn-outline btn-sm" onclick="startEdit('${item.id}')">編集・フェーズ更新</button>
            <button class="btn-danger" onclick="deleteItem('${item.id}')">削除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
  }
</script>
